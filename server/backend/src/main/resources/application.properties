spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Nexus}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:sk-proj-dummy-key-for-local-testing}
spring.ai.openai.chat.options.model=${FREE_MODELS:openrouter/free}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://openrouter.ai/api}