services:
  backend:
    build: ./server/backend
    container_name: nexus-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
  
  server-python:
    build: ./server/ai
    container_name: nexus-ai
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build: ./client/clario
    container_name: nexus-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend